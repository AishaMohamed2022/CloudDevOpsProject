apiVersion: v1
kind: ConfigMap
metadata:
  name: ivolve-config
  namespace: ivolve
data:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "ivolve"
  DB_USER: "ivolve_user"
  AUTH_SERVICE_URL: "http://auth-service:5000"
  ROADMAP_SERVICE_URL: "http://roadmap-service:8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: ivolve-secret
  namespace: ivolve
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "rootpassword"
  MYSQL_PASSWORD: "ivolve_password"
  SESSION_SECRET: "ivolve_k8s_super_secret_key"
