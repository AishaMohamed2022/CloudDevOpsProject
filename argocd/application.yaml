apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ivolve-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AishaMohamed2022/CloudDevOpsProject.git'
    targetRevision: HEAD
    path: 'kubernetes'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ivolve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true