name: Shared CI Reusable Pipeline

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      context_dir:
        required: true
        type: string
      manifest_file:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      # الخطوة 1: سحب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # تسجيل الدخول إلى Container Registry (Docker Hub)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------------------------------------------
      # Stage 1: Build Image
      # -------------------------------------------------------------
      - name: Stage 1 - Build Image
        run: |
          IMAGE_TAG="${{ secrets.DOCKER_USERNAME }}/ivolve-${{ inputs.service_name }}:${{ github.sha }}"
          LATEST_TAG="${{ secrets.DOCKER_USERNAME }}/ivolve-${{ inputs.service_name }}:latest"
          docker build -t $IMAGE_TAG -t $LATEST_TAG ./${{ inputs.context_dir }}

      # -------------------------------------------------------------
      # Stage 2: Scan Image (Trivy Security Scanner)
      # -------------------------------------------------------------
      - name: Stage 2 - Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME }}/ivolve-${{ inputs.service_name }}:${{ github.sha }}"
          format: 'table'
          exit-code: '0' # لا يوقف البايبلاين إن وجد تحذيرات عادية
          severity: 'CRITICAL,HIGH'

      # -------------------------------------------------------------
      # Stage 3: Push Image
      # -------------------------------------------------------------
      - name: Stage 3 - Push Image to Registry
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ivolve-${{ inputs.service_name }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/ivolve-${{ inputs.service_name }}:latest

      # -------------------------------------------------------------
      # Stage 4: Delete Image Locally
      # -------------------------------------------------------------
      - name: Stage 4 - Delete Image Locally
        run: |
          docker rmi ${{ secrets.DOCKER_USERNAME }}/ivolve-${{ inputs.service_name }}:${{ github.sha }} || true
          docker rmi ${{ secrets.DOCKER_USERNAME }}/ivolve-${{ inputs.service_name }}:latest || true

      # -------------------------------------------------------------
      # Stage 5: Update Manifests
      # -------------------------------------------------------------
      - name: Stage 5 - Update Kubernetes Manifest
        run: |
          NEW_IMAGE="${{ secrets.DOCKER_USERNAME }}/ivolve-${{ inputs.service_name }}:${{ github.sha }}"
          sed -i -E "s|image: .*/ivolve-${{ inputs.service_name }}:.*|image: ${NEW_IMAGE}|g" ${{ inputs.manifest_file }}
          echo "Updated ${{ inputs.manifest_file }} with new image: ${NEW_IMAGE}"

      # -------------------------------------------------------------
      # Stage 6: Push Manifests (GitOps loop trigger)
      # -------------------------------------------------------------
      - name: Stage 6 - Push Manifests back to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.manifest_file }}
          # التحقق من وجود تعديل قبل عمل commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(ci): update ${{ inputs.service_name }} image to ${{ github.sha }} [skip ci]"
            git push origin main
          fi